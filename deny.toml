# Checked in CI by `cargo deny check`: known vulnerabilities, licenses and where crates come from.
[graph]
all-features = true

[advisories]
# Unmaintained crates are reported for direct dependencies only; deeper ones are up to their users.
unmaintained = "workspace"
ignore = []

[licenses]
# Licenses that may be combined with Kubri's Apache-2.0.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
