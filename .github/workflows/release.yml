name: Release

# Pushing a tag like v0.1.0 builds the desktop app for Windows, macOS and Linux and attaches
# the installers to a draft release, to check and publish by hand. The Docker workflow
# publishes the image for the same tag.
#
# Pull requests that change the packaging, and manual runs, build the installers without a
# release and keep them as workflow artifacts to try out.

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - ui/src-tauri/**
  workflow_dispatch:

jobs:
  draft:
    name: Draft release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - name: Check that the tag matches the version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::The tag $GITHUB_REF_NAME does not match the version $version in Cargo.toml"
            exit 1
          fi
      # One release for all builds, so parallel jobs do not each create one. A release published
      # on GitHub's release page creates its tag itself; the builds are attached to that one.
      - id: create
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" --jq .id 2>/dev/null); then
            echo "Attaching the builds to the existing release $id"
          else
            id=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$GITHUB_REF_NAME" -f name="Kubri $GITHUB_REF_NAME" \
              -F draft=true -F body=@.github/release-notes.md --jq .id)
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  desktop:
    name: Desktop (${{ matrix.name }})
    needs: draft
    if: ${{ !cancelled() && needs.draft.result != 'failure' }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS, Apple silicon
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macOS, Intel
            os: macos-latest
            target: x86_64-apple-darwin
          - name: Linux, x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: Linux, Arm
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - name: Windows, x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Ubuntu 22.04 keeps the packages working on older distributions.
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf file
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install UI dependencies
        working-directory: ui
        run: pnpm install --frozen-lockfile
      # With the signing key set up (docs/RELEASING.md), the packages are signed for the app's
      # updater and the public key goes into the app; without it, they are built as before.
      - name: Sign updates
        id: updater
        shell: bash
        env:
          PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$PUBKEY" ] && [ -n "$KEY" ]; then
            config=$(jq -cn --arg key "$PUBKEY" '{bundle: {createUpdaterArtifacts: true}, plugins: {updater: {pubkey: $key}}}')
            echo "args=--config '$config'" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No updater signing key: the packages are not signed for the updater"
          fi
      # Without a release id (no tag), this only builds. latest.json comes from the Updater job,
      # since the parallel builds would overwrite each other's.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: ui
          releaseId: ${{ needs.draft.outputs.id }}
          uploadUpdaterJson: false
          args: --target ${{ matrix.target }} ${{ steps.updater.outputs.args }}
      - if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: kubri-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/deb/*.deb
            target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            target/${{ matrix.target }}/release/bundle/msi/*.msi
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error

  # The updater in the app reads latest.json from the latest release: the signed packages of
  # this release, made from the .sig files the builds attached.
  updater:
    name: Updater
    needs: [draft, desktop]
    if: ${{ github.ref_type == 'tag' && !cancelled() && needs.draft.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE: ${{ needs.draft.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - name: Attach latest.json
        run: |
          mkdir sigs
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$RELEASE/assets" \
            --jq '.[] | select(.name | endswith(".sig")) | "\(.id) \(.name)"' |
            while read -r id name; do
              gh api -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$id" > "sigs/$name"
            done
          if ! ls sigs/*.sig > /dev/null 2>&1; then
            echo "::notice::The release has no signed update packages, so no latest.json"
            exit 0
          fi
          packaging/latest-json.sh "${GITHUB_REF_NAME#v}" sigs > latest.json
          cat latest.json
          old=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE/assets" --jq '.[] | select(.name == "latest.json") | .id')
          if [ -n "$old" ]; then gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$old"; fi
          # By id: a draft has no tag to find it by yet.
          gh api -X POST -H 'Content-Type: application/json' --input latest.json \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE/assets?name=latest.json" --jq .browser_download_url

  # Fills the Homebrew cask, winget manifests, AUR package and Flatpak manifest with the
  # release's checksums and publishes each where its secret is set; see docs/RELEASING.md.
  packages:
    name: Packages
    needs: [draft, desktop]
    if: ${{ github.ref_type == 'tag' && !cancelled() && needs.desktop.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
      FLATHUB_TOKEN: ${{ secrets.FLATHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Fill in the packaging
        run: |
          version=${GITHUB_REF_NAME#v}
          echo "VERSION=$version" >> "$GITHUB_ENV"
          mkdir assets
          gh api "repos/$GITHUB_REPOSITORY/releases/${{ needs.draft.outputs.id }}" \
            --jq '.assets[] | select(.name | test("\\.dmg$|\\.deb$|-setup\\.exe$")) | "\(.id) \(.name)"' |
            while read -r id name; do
              gh api -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$id" > "assets/$name"
            done
          packaging/render.sh "$version" assets packages
          # The packages point at the release's downloads, which a draft does not have yet.
          echo "PUBLISHED=$(gh api "repos/$GITHUB_REPOSITORY/releases/${{ needs.draft.outputs.id }}" --jq '.draft | not')" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: packages
          include-hidden-files: true
      - name: Homebrew tap
        if: env.PUBLISHED == 'true' && env.HOMEBREW_TAP_TOKEN != ''
        run: |
          git clone "https://x-access-token:$HOMEBREW_TAP_TOKEN@github.com/snaketech-tu/homebrew-kubri.git" tap
          mkdir -p tap/Casks
          cp packages/homebrew/kubri.rb tap/Casks/kubri.rb
          cd tap
          git config user.name 'snake.tech'
          git config user.email 'tolga.urhan@hotmail.de'
          git add Casks/kubri.rb
          git commit -m "kubri $VERSION"
          git push
      - name: AUR
        if: env.PUBLISHED == 'true' && env.AUR_SSH_KEY != ''
        run: |
          # .SRCINFO comes from makepkg, which runs on Arch as a user other than root.
          docker run --rm -v "$PWD/packages/aur:/pkg" archlinux:base-devel bash -c \
            'useradd -m build && cp /pkg/PKGBUILD /home/build/ && chown build /home/build/PKGBUILD &&
             su build -c "cd ~ && makepkg --printsrcinfo" > /pkg/.SRCINFO'
          mkdir -p ~/.ssh
          printf '%s\n' "$AUR_SSH_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/aur"
          git clone ssh://aur@aur.archlinux.org/kubri-bin.git aur
          cp packages/aur/PKGBUILD packages/aur/.SRCINFO aur/
          cd aur
          git config user.name 'snake.tech'
          git config user.email 'tolga.urhan@hotmail.de'
          git add PKGBUILD .SRCINFO
          git commit -m "Update to $VERSION"
          git push origin HEAD:master
      - name: Flathub
        if: env.PUBLISHED == 'true' && env.FLATHUB_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.FLATHUB_TOKEN }}
        run: |
          app=io.github.snaketech_tu.kubri
          git clone "https://x-access-token:$FLATHUB_TOKEN@github.com/flathub/$app.git" flathub
          cp packages/flatpak/* flathub/
          cd flathub
          git config user.name 'snake.tech'
          git config user.email 'tolga.urhan@hotmail.de'
          git checkout -b "update-$VERSION"
          git add .
          git commit -m "Update to $VERSION"
          git push origin "update-$VERSION"
          gh pr create --repo "flathub/$app" --head "update-$VERSION" --title "Update to $VERSION" \
            --body "Kubri $VERSION: https://github.com/snaketech-tu/kubri/releases/tag/v$VERSION"

  # winget's own tool opens the pull request to microsoft/winget-pkgs once the package is in it.
  winget:
    name: winget
    needs: [draft, desktop]
    if: ${{ github.ref_type == 'tag' && !cancelled() && needs.desktop.result == 'success' }}
    runs-on: windows-latest
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Open the winget pull request
        if: env.WINGET_TOKEN != ''
        shell: pwsh
        run: |
          # The manifest points at the release's download, which a draft does not have yet.
          $draft = gh api "repos/$env:GITHUB_REPOSITORY/releases/${{ needs.draft.outputs.id }}" --jq .draft
          if ($draft -eq 'true') { Write-Output 'The release is a draft; run this job again once it is published.'; exit 0 }
          $version = "$env:GITHUB_REF_NAME".TrimStart('v')
          $url = "https://github.com/snaketech-tu/kubri/releases/download/v$version/Kubri_${version}_x64-setup.exe"
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          .\wingetcreate.exe update SnakeTech.Kubri --version $version --urls $url --submit --token $env:WINGET_TOKEN
