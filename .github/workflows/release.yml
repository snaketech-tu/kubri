name: Release

# Pushing a tag like v0.1.0 builds the desktop app for Windows, macOS and Linux and attaches
# the installers to a draft release, to check and publish by hand. The Docker workflow
# publishes the image for the same tag.
#
# Pull requests that change the packaging, and manual runs, build the installers without a
# release and keep them as workflow artifacts to try out.

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - ui/src-tauri/**
  workflow_dispatch:

jobs:
  draft:
    name: Draft release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - name: Check that the tag matches the version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::The tag $GITHUB_REF_NAME does not match the version $version in Cargo.toml"
            exit 1
          fi
      # One release for all builds, so parallel jobs do not each create one. A release published
      # on GitHub's release page creates its tag itself; the builds are attached to that one.
      - id: create
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" --jq .id 2>/dev/null); then
            echo "Attaching the builds to the existing release $id"
          else
            id=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$GITHUB_REF_NAME" -f name="Kubri $GITHUB_REF_NAME" \
              -F draft=true -F body=@.github/release-notes.md --jq .id)
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  desktop:
    name: Desktop (${{ matrix.name }})
    needs: draft
    if: ${{ !cancelled() && needs.draft.result != 'failure' }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS, Apple silicon
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macOS, Intel
            os: macos-latest
            target: x86_64-apple-darwin
          - name: Linux, x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: Linux, Arm
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - name: Windows, x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Ubuntu 22.04 keeps the packages working on older distributions.
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf file
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install UI dependencies
        working-directory: ui
        run: pnpm install --frozen-lockfile
      # Without a release id (no tag), this only builds.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ui
          releaseId: ${{ needs.draft.outputs.id }}
          args: --target ${{ matrix.target }}
      - if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: kubri-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/deb/*.deb
            target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            target/${{ matrix.target }}/release/bundle/msi/*.msi
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error
