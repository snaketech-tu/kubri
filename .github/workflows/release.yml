name: Release

# Run by hand with "publish" on main, this releases the version in Cargo.toml in one go: it
# builds the desktop app for Windows, macOS and Linux and the Docker image into a draft
# release, and publishes it, which creates the tag, once everything is attached.
#
# Pushing a tag like v0.1.0 builds the installers into a draft release to publish by hand, and
# the Docker workflow publishes the image for the tag.
#
# Pull requests that change the packaging, and manual runs, build the installers without a
# release and keep them as workflow artifacts to try out.

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - ui/src-tauri/**
  workflow_dispatch:
    inputs:
      publish:
        description: Release the version in Cargo.toml and publish it once everything is built
        type: boolean
        default: false

jobs:
  draft:
    name: Draft release
    if: github.ref_type == 'tag' || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      id: ${{ steps.create.outputs.id }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: Check the version
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
              echo "::error::The tag $GITHUB_REF_NAME does not match the version $version in Cargo.toml"
              exit 1
            fi
          else
            if [ "$GITHUB_REF_NAME" != main ]; then
              echo "::error::Releases are made from main; run this on main, not $GITHUB_REF_NAME"
              exit 1
            fi
            if gh api "repos/$GITHUB_REPOSITORY/git/refs/tags/v$version" > /dev/null 2>&1; then
              echo "::error::v$version is already released; set a new version in Cargo.toml first (docs/RELEASING.md)"
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      # One release for all builds, so parallel jobs do not each create one. A release published
      # on GitHub's release page creates its tag itself; the builds are attached to that one. A
      # draft from an earlier run that did not finish is used again.
      - id: create
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .id 2>/dev/null) || id=
          if [ -z "$id" ] && [ "$GITHUB_REF_TYPE" != tag ]; then
            id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
              --jq ".[] | select(.draft and .tag_name == \"$TAG\") | .id" | head -n 1)
            # A run by hand tags this commit when it publishes the draft. The tag name is sent
            # again, as GitHub can drop it from a draft whose target changes, and the notes are
            # the ones of this commit.
            if [ -n "$id" ]; then
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" -f tag_name="$TAG" \
                -f target_commitish="$GITHUB_SHA" -F body=@.github/release-notes.md > /dev/null
            fi
          fi
          if [ -n "$id" ]; then
            echo "Attaching the builds to the existing release $id"
          else
            id=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" -f name="Kubri $TAG" \
              -F draft=true -F body=@.github/release-notes.md --jq .id)
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  desktop:
    name: Desktop (${{ matrix.name }})
    needs: draft
    if: ${{ !cancelled() && needs.draft.result != 'failure' }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS, Apple silicon
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macOS, Intel
            os: macos-latest
            target: x86_64-apple-darwin
          - name: Linux, x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: Linux, Arm
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - name: Windows, x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          # Built on x64: Tauri's MSI tooling has no Arm build, so only the setup.exe.
          - name: Windows, Arm
            os: windows-latest
            target: aarch64-pc-windows-msvc
            bundles: --bundles nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # Ubuntu 22.04 keeps the packages working on older distributions.
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf file
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - name: Install UI dependencies
        working-directory: ui
        run: pnpm install --frozen-lockfile
      # With the signing key set up (docs/RELEASING.md), the packages are signed for the app's
      # updater and the public key goes into the app; without it, they are built as before.
      - name: Sign updates
        id: updater
        shell: bash
        env:
          PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$PUBKEY" ] && [ -n "$KEY" ]; then
            config=$(jq -cn --arg key "$PUBKEY" '{bundle: {createUpdaterArtifacts: true}, plugins: {updater: {pubkey: $key}}}')
            echo "args=--config '$config'" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No updater signing key: the packages are not signed for the updater"
          fi
      # With an Apple Developer ID certificate in the secrets (docs/RELEASING.md#code-signing), the
      # macOS app is signed with it and, with the notarization secrets too, notarized. Without
      # them it stays signed ad hoc, as tauri.conf.json says.
      - name: Set up macOS signing
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::notice::No Apple certificate: the macOS app is signed ad hoc and not notarized"
            exit 0
          fi
          {
            echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE"
            echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
          } >> "$GITHUB_ENV"
          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            {
              echo "APPLE_ID=$APPLE_ID"
              echo "APPLE_PASSWORD=$APPLE_PASSWORD"
              echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::Signed but not notarized: set APPLE_ID, APPLE_PASSWORD and APPLE_TEAM_ID"
          fi
      # Without a release id (no tag), this only builds. latest.json comes from the Updater job,
      # since the parallel builds would overwrite each other's.
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: ui
          releaseId: ${{ needs.draft.outputs.id }}
          uploadUpdaterJson: false
          args: --target ${{ matrix.target }} ${{ matrix.bundles }} ${{ steps.updater.outputs.args }}
      - if: needs.draft.outputs.id == ''
        uses: actions/upload-artifact@v7
        with:
          name: kubri-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/deb/*.deb
            target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            target/${{ matrix.target }}/release/bundle/msi/*.msi
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error

  # The updater in the app reads latest.json from the latest release: the signed packages of
  # this release, made from the .sig files the builds attached.
  updater:
    name: Updater
    needs: [draft, desktop]
    if: ${{ !cancelled() && needs.draft.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE: ${{ needs.draft.outputs.id }}
      VERSION: ${{ needs.draft.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Attach latest.json
        run: |
          mkdir sigs
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$RELEASE/assets" \
            --jq '.[] | select(.name | endswith(".sig")) | "\(.id) \(.name)"' |
            while read -r id name; do
              gh api -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$id" > "sigs/$name"
            done
          if ! ls sigs/*.sig > /dev/null 2>&1; then
            echo "::notice::The release has no signed update packages, so no latest.json"
            exit 0
          fi
          packaging/latest-json.sh "$VERSION" sigs > latest.json
          cat latest.json
          old=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE/assets" --jq '.[] | select(.name == "latest.json") | .id')
          if [ -n "$old" ]; then gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$old"; fi
          # By id: a draft has no tag to find it by yet.
          gh api -X POST -H 'Content-Type: application/json' --input latest.json \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE/assets?name=latest.json" --jq .browser_download_url

  # The image for a release made by hand; for a pushed tag, the Docker workflow runs itself.
  docker:
    name: Docker
    needs: draft
    if: inputs.publish
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yml
    with:
      version: ${{ needs.draft.outputs.version }}

  # Publishing the draft creates the tag, on the commit the run was started on.
  publish:
    name: Publish
    needs: [draft, desktop, updater, docker]
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Publish the release
        run: |
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/${{ needs.draft.outputs.id }}" \
            -f tag_name="${{ needs.draft.outputs.tag }}" -F draft=false -f make_latest=true --jq .html_url

  # The website and its live demo, from the commit just released.
  website:
    name: Website
    needs: publish
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml

  # The Helm chart as an OCI package next to the image: oci://ghcr.io/<owner>/charts/kubri.
  helm:
    name: Helm chart
    needs: [draft, publish]
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Package and push the chart
        env:
          VERSION: ${{ needs.draft.outputs.version }}
          OWNER: ${{ github.repository_owner }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chart=$(grep '^version:' deploy/helm/kubri/Chart.yaml | awk '{print $2}')
          if [ "$chart" != "$VERSION" ]; then
            echo "::error::deploy/helm/kubri/Chart.yaml has version $chart, not $VERSION"
            exit 1
          fi
          helm lint deploy/helm/kubri
          helm package deploy/helm/kubri --destination chart
          printf '%s' "$TOKEN" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          helm push "chart/kubri-$VERSION.tgz" "oci://ghcr.io/${OWNER,,}/charts"
          echo "Helm chart pushed: \`helm install kubri oci://ghcr.io/${OWNER,,}/charts/kubri --version $VERSION\`" >> "$GITHUB_STEP_SUMMARY"

  # Fills the Homebrew cask, winget manifests, AUR package and Flatpak manifest with the
  # release's checksums and publishes each where its secret is set; see docs/RELEASING.md.
  packages:
    name: Packages
    needs: [draft, desktop, publish]
    if: ${{ !cancelled() && needs.draft.outputs.id != '' && needs.desktop.result == 'success' && needs.publish.result != 'failure' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
      FLATHUB_TOKEN: ${{ secrets.FLATHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - name: Fill in the packaging
        run: |
          version=${{ needs.draft.outputs.version }}
          echo "VERSION=$version" >> "$GITHUB_ENV"
          mkdir assets
          gh api "repos/$GITHUB_REPOSITORY/releases/${{ needs.draft.outputs.id }}" \
            --jq '.assets[] | select(.name | test("\\.dmg$|\\.deb$|-setup\\.exe$")) | "\(.id) \(.name)"' |
            while read -r id name; do
              gh api -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$id" > "assets/$name"
            done
          packaging/render.sh "$version" assets packages
          # The packages point at the release's downloads, which a draft does not have yet.
          echo "PUBLISHED=$(gh api "repos/$GITHUB_REPOSITORY/releases/${{ needs.draft.outputs.id }}" --jq '.draft | not')" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: packages
          include-hidden-files: true
      - name: Homebrew tap
        if: env.PUBLISHED == 'true' && env.HOMEBREW_TAP_TOKEN != ''
        run: |
          git clone "https://x-access-token:$HOMEBREW_TAP_TOKEN@github.com/snaketech-tu/homebrew-kubri.git" tap
          mkdir -p tap/Casks
          cp packages/homebrew/kubri.rb tap/Casks/kubri.rb
          cd tap
          git config user.name 'snake.tech'
          git config user.email 'tolga.urhan@hotmail.de'
          git add Casks/kubri.rb
          git commit -m "kubri $VERSION"
          git push
      - name: AUR
        if: env.PUBLISHED == 'true' && env.AUR_SSH_KEY != ''
        run: |
          # .SRCINFO comes from makepkg, which runs on Arch as a user other than root.
          docker run --rm -v "$PWD/packages/aur:/pkg" archlinux:base-devel bash -c \
            'useradd -m build && cp /pkg/PKGBUILD /home/build/ && chown build /home/build/PKGBUILD &&
             su build -c "cd ~ && makepkg --printsrcinfo" > /pkg/.SRCINFO'
          mkdir -p ~/.ssh
          printf '%s\n' "$AUR_SSH_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/aur"
          git clone ssh://aur@aur.archlinux.org/kubri-bin.git aur
          cp packages/aur/PKGBUILD packages/aur/.SRCINFO aur/
          cd aur
          git config user.name 'snake.tech'
          git config user.email 'tolga.urhan@hotmail.de'
          git add PKGBUILD .SRCINFO
          git commit -m "Update to $VERSION"
          git push origin HEAD:master
      - name: Flathub
        if: env.PUBLISHED == 'true' && env.FLATHUB_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.FLATHUB_TOKEN }}
        run: |
          app=io.github.snaketech_tu.kubri
          git clone "https://x-access-token:$FLATHUB_TOKEN@github.com/flathub/$app.git" flathub
          cp packages/flatpak/* flathub/
          cd flathub
          git config user.name 'snake.tech'
          git config user.email 'tolga.urhan@hotmail.de'
          git checkout -b "update-$VERSION"
          git add .
          git commit -m "Update to $VERSION"
          git push origin "update-$VERSION"
          gh pr create --repo "flathub/$app" --head "update-$VERSION" --title "Update to $VERSION" \
            --body "Kubri $VERSION: https://github.com/snaketech-tu/kubri/releases/tag/v$VERSION"
      # A channel without its secret is skipped; say so where it is seen, not only in the logs.
      - name: Report the channels
        if: always()
        run: |
          summary() { echo "$1" >> "$GITHUB_STEP_SUMMARY"; }
          summary "### Package channels for $VERSION"
          if [ "$PUBLISHED" != 'true' ]; then
            summary "The release is still a draft, so nothing was published. Run this job again after publishing."
          fi
          for channel in "Homebrew:HOMEBREW_TAP_TOKEN" "AUR:AUR_SSH_KEY" "Flathub:FLATHUB_TOKEN"; do
            name=${channel%%:*}; secret=${channel#*:}
            if [ -z "${!secret}" ]; then
              summary "- $name: skipped, the secret $secret is not set"
              echo "::warning title=$name not published::The secret $secret is not set; see docs/RELEASING.md#package-managers"
            elif [ "$PUBLISHED" = 'true' ]; then
              summary "- $name: published"
            fi
          done

  # winget's own tool opens the pull request to microsoft/winget-pkgs once the package is in it.
  winget:
    name: winget
    needs: [draft, desktop, publish]
    if: ${{ !cancelled() && needs.draft.outputs.id != '' && needs.desktop.result == 'success' && needs.publish.result != 'failure' }}
    runs-on: windows-latest
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.draft.outputs.version }}
    steps:
      - name: Report a missing secret
        if: env.WINGET_TOKEN == ''
        shell: bash
        run: |
          echo "::warning title=winget not published::The secret WINGET_TOKEN is not set; see docs/RELEASING.md#package-managers"
          echo "- winget: skipped, the secret WINGET_TOKEN is not set" >> "$GITHUB_STEP_SUMMARY"
      - name: Open the winget pull request
        if: env.WINGET_TOKEN != ''
        shell: pwsh
        run: |
          # The manifest points at the release's download, which a draft does not have yet.
          $draft = gh api "repos/$env:GITHUB_REPOSITORY/releases/${{ needs.draft.outputs.id }}" --jq .draft
          if ($draft -eq 'true') { Write-Output 'The release is a draft; run this job again once it is published.'; exit 0 }
          $version = $env:VERSION
          $base = "https://github.com/snaketech-tu/kubri/releases/download/v$version"
          $urls = "$base/Kubri_${version}_x64-setup.exe", "$base/Kubri_${version}_arm64-setup.exe"
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          .\wingetcreate.exe update SnakeTech.Kubri --version $version --urls $urls --submit --token $env:WINGET_TOKEN
