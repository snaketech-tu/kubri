name: Website

# Builds the website with the live demo: site/ at the top, and the web app at demo/, answering
# from a recording of kubri-server showing the demo snapshot (scripts/demo/record.cjs).
#
# Pull requests that touch it only build it. The Release workflow publishes it after each
# release, and it can be run by hand. Publishing needs GitHub Pages set to "GitHub Actions" in
# the repository's settings; until then the build runs and publishing is skipped.
#
# With the secret APT_SIGNING_KEY set, the site also carries Kubri's apt repository at apt/, made
# from the .deb files of the latest releases (packaging/apt/build.sh, docs/RELEASING.md).

on:
  pull_request:
    paths:
      - site/**
      - packaging/apt/**
      - scripts/demo/**
      - ui/static/demo.kubri
      - ui/src/lib/api/replay.ts
      - .github/workflows/pages.yml
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      publish: ${{ steps.pages.outputs.publish }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: Look up GitHub Pages
        id: pages
        run: |
          if site=$(gh api "repos/$GITHUB_REPOSITORY/pages" 2>/dev/null) && [ "$(jq -r .build_type <<<"$site")" = workflow ]; then
            url=$(jq -r .html_url <<<"$site" | sed -E 's#/$##')
            base=$(sed -E 's#^https?://[^/]+##' <<<"$url")
            echo "publish=${{ github.event_name != 'pull_request' }}" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::GitHub Pages is not set to GitHub Actions in the repository's settings, so the website is built but not published."
            base="/${GITHUB_REPOSITORY#*/}"
            url="https://${GITHUB_REPOSITORY_OWNER}.github.io$base"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the web app and kubri-server
        run: |
          (cd ui && pnpm install --frozen-lockfile && pnpm build)
          cargo build --release -p kubri-server
      - name: Install Playwright
        run: npm install --no-save --prefix "$RUNNER_TEMP/pw" playwright@1.63.0 && "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: Record the demo
        run: node scripts/demo/record.cjs "$RUNNER_TEMP/pw/node_modules/playwright" "$RUNNER_TEMP/demo-recording.json"
      - name: Build the live demo
        working-directory: ui
        env:
          KUBRI_BASE_PATH: ${{ steps.pages.outputs.base }}/demo
          VITE_KUBRI_DEMO: demo-recording.json
        run: pnpm build
      - name: Put the website together
        run: |
          mkdir -p _site/assets
          cp -r site/. _site/
          cp -r ui/build _site/demo
          cp "$RUNNER_TEMP/demo-recording.json" _site/demo/
          cp docs/assets/kubri-logo.svg docs/assets/kubri-logo-dark.svg docs/assets/kubri-link.svg _site/assets/
          cp docs/assets/screenshots/{overview,logs,xray,palette}.png _site/assets/
          cp docs/assets/kubri-tour-light.gif docs/assets/kubri-tour-dark.gif _site/assets/
      - name: Build the apt repository
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          if [ -z "$APT_SIGNING_KEY" ]; then
            if [ "${{ github.event_name }}" != pull_request ]; then
              echo "::notice::The secret APT_SIGNING_KEY is not set, so the website has no apt repository."
              exit 0
            fi
            # A pull request checks the build with a key made for it; nothing is published.
            export GNUPGHOME="$RUNNER_TEMP/gnupg"
            mkdir -m 700 "$GNUPGHOME"
            gpg --batch --passphrase '' --quick-gen-key 'Kubri test key' ed25519 sign 1d
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq apt-utils appstream appstream-compose
          # The .deb files of the three latest releases, so apt can also go back a version.
          mkdir "$RUNNER_TEMP/debs"
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=10" \
            --jq '[.[] | select(.draft == false and .prerelease == false)][:3][] | .assets[]
              | select(.name | endswith(".deb")) | "\(.id) \(.name)"' |
            while read -r id name; do
              gh api -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$id" \
                > "$RUNNER_TEMP/debs/$name"
            done
          packaging/apt/build.sh "$RUNNER_TEMP/debs" _site/apt "${{ steps.pages.outputs.url }}/apt"
          du -sh _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  publish:
    name: Publish
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
