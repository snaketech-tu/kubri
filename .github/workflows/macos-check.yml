name: macOS check
on:
  push:
    branches: [fix/macos-theme-check]
permissions:
  contents: write
jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Kubri 1.5.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.5.0 -p 'Kubri_1.5.0_aarch64.dmg' -D /tmp
          hdiutil attach /tmp/Kubri_1.5.0_aarch64.dmg -mountpoint /tmp/kubri-dmg -nobrowse
          cp -R /tmp/kubri-dmg/Kubri.app /Applications/
          brew install cliclick
          sw_vers
      - name: Drive the app
        run: bash .github/macos-drive.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shots
          path: shots
      - if: always()
        run: |
          git config user.name snake.tech && git config user.email tolga.urhan@hotmail.de
          git checkout --orphan shots-out && git rm -rqf . && git add -f shots && git commit -qm shots
          git push -f origin HEAD:fix/macos-theme-shots
