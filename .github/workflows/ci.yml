name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  ui:
    name: UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      # The desktop app embeds the built UI at compile time.
      - name: Build UI
        working-directory: ui
        run: pnpm install --frozen-lockfile && pnpm build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # Kubri against a k3s cluster with 10,000 pods; see docs/SPEED.md.
  speed:
    name: Speed
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Start k3s
        run: |
          curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION=v1.33.5+k3s1 INSTALL_K3S_EXEC="--disable=traefik --write-kubeconfig-mode=644" sh -
          mkdir -p ~/.kube && cp /etc/rancher/k3s/k3s.yaml ~/.kube/config
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Build UI
        working-directory: ui
        run: pnpm install --frozen-lockfile && pnpm build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: speed
      - run: cargo build --release -p kubri-server
      - name: Fill the cluster
        run: |
          kubectl wait --for=condition=Ready node --all --timeout=120s
          bench/speed/seed.sh 10000
      - name: Install Playwright
        run: npm install --no-save --prefix "$RUNNER_TEMP/pw" playwright@1.63.0 && "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: Measure
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/pw/node_modules/playwright
          BENCH_OUT: speed.json
        run: node bench/speed/run.cjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: speed
          path: |
            speed.json
            speed-*.png

  # The web app's main flows in a browser against a k3s cluster; see scripts/e2e/README.md.
  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Start k3s
        run: |
          curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION=v1.33.5+k3s1 INSTALL_K3S_EXEC="--disable=traefik --write-kubeconfig-mode=644" sh -
          mkdir -p ~/.kube && cp /etc/rancher/k3s/k3s.yaml ~/.kube/config
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Build UI
        working-directory: ui
        run: pnpm install --frozen-lockfile && pnpm build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: e2e
      - run: cargo build --release -p kubri-server
      - name: Create the test objects
        run: |
          kubectl wait --for=condition=Ready node --all --timeout=120s
          kubectl apply -f scripts/e2e/fixtures.yaml
          kubectl rollout status deployment/web -n e2e --timeout=180s
      - name: Install Playwright
        run: npm install --no-save --prefix "$RUNNER_TEMP/pw" playwright@1.63.0 && "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: Test
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/pw/node_modules/playwright
          E2E_ARTIFACTS: e2e-artifacts
        run: node --test --test-reporter=spec scripts/e2e/kubri.test.cjs
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e
          path: e2e-artifacts

  # The desktop app on Linux starts, connects to k3s and shows the overview.
  desktop:
    name: Desktop start
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Start k3s
        run: |
          curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION=v1.33.5+k3s1 INSTALL_K3S_EXEC="--disable=traefik --write-kubeconfig-mode=644" sh -
          mkdir -p ~/.kube && cp /etc/rancher/k3s/k3s.yaml ~/.kube/config
      - name: Install Tauri system dependencies and the WebKit driver
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libayatana-appindicator3-dev librsvg2-dev webkit2gtk-driver xvfb
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Build UI
        working-directory: ui
        run: pnpm install --frozen-lockfile && pnpm build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop
      - run: cargo install tauri-driver --locked
      # custom-protocol embeds the built UI instead of loading the dev server.
      - run: cargo build -p kubri-desktop --features tauri/custom-protocol
      - name: Start the app
        run: |
          kubectl wait --for=condition=Ready node --all --timeout=120s
          xvfb-run -a node scripts/e2e/desktop.cjs
