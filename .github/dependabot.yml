# Weekly dependency updates: one pull request per ecosystem for minor and patch versions,
# so CI checks them together; a major version gets its own pull request.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      rust:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      ui:
        update-types: [minor, patch]
    # Stays at the Node.js version that CI and the image use; move them together by hand.
    ignore:
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Node.js moves to a new major version by hand, with CI and @types/node.
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
