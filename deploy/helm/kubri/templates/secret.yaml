{{- if and (eq .Values.auth "password") (not .Values.password.existingSecret) }}
{{- $name := include "kubri.passwordSecret" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "kubri.labels" . | nindent 4 }}
type: Opaque
data:
  # Made once and kept on upgrades.
  password: {{ (and $existing $existing.data.password) | default (randAlphaNum 24 | b64enc) | quote }}
{{- end }}
{{- if and (eq .Values.auth "oidc") .Values.oidc.clientSecret (not .Values.oidc.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kubri.oidcSecret" . }}
  labels:
    {{- include "kubri.labels" . | nindent 4 }}
type: Opaque
stringData:
  client-secret: {{ .Values.oidc.clientSecret | quote }}
{{- end }}
