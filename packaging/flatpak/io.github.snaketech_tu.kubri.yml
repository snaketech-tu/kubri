# Flatpak manifest for Flathub, made from the release's .deb. The release workflow fills in the
# version and checksums; see docs/RELEASING.md.
id: io.github.snaketech_tu.kubri
runtime: org.gnome.Platform
runtime-version: '48'
sdk: org.gnome.Sdk
command: kubri
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # The kubeconfig and the k9s files Kubri reads, like kubectl and k9s do.
  - --filesystem=~/.kube:ro
  - --filesystem=xdg-config/k9s:ro
  - --env=K9S_CONFIG_DIR=~/.config/k9s
modules:
  - name: kubri
    buildsystem: simple
    sources:
      - type: file
        only-arches: [x86_64]
        url: https://github.com/snaketech-tu/kubri/releases/download/v@VERSION@/Kubri_@VERSION@_amd64.deb
        sha256: '@SHA256_DEB_AMD64@'
        dest-filename: kubri.deb
      - type: file
        only-arches: [aarch64]
        url: https://github.com/snaketech-tu/kubri/releases/download/v@VERSION@/Kubri_@VERSION@_arm64.deb
        sha256: '@SHA256_DEB_ARM64@'
        dest-filename: kubri.deb
      - type: file
        path: io.github.snaketech_tu.kubri.metainfo.xml
    build-commands:
      - ar x kubri.deb
      - tar xf data.tar.gz
      - install -Dm755 usr/bin/kubri /app/bin/kubri
      - install -Dm644 usr/share/icons/hicolor/32x32/apps/kubri.png /app/share/icons/hicolor/32x32/apps/${FLATPAK_ID}.png
      - install -Dm644 usr/share/icons/hicolor/128x128/apps/kubri.png /app/share/icons/hicolor/128x128/apps/${FLATPAK_ID}.png
      - sed -e "s/^Icon=.*/Icon=${FLATPAK_ID}/" usr/share/applications/Kubri.desktop > ${FLATPAK_ID}.desktop
      - install -Dm644 ${FLATPAK_ID}.desktop /app/share/applications/${FLATPAK_ID}.desktop
      - install -Dm644 ${FLATPAK_ID}.metainfo.xml /app/share/metainfo/${FLATPAK_ID}.metainfo.xml
