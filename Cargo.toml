[workspace]
resolver = "2"
members = ["crates/kubri-core", "crates/kubri-mcp", "crates/kubri-cli", "crates/kubri-server", "ui/src-tauri"]

[workspace.package]
version = "1.11.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/snaketech-tu/kubri"
rust-version = "1.90"
# Kubri ships as apps and images, not as crates on crates.io.
publish = false

[workspace.dependencies]
kubri-core = { path = "crates/kubri-core" }
kubri-mcp = { path = "crates/kubri-mcp" }
kubri-cli = { path = "crates/kubri-cli" }
kube = { version = "5.0", default-features = false, features = ["client", "config", "runtime", "rustls-tls", "ring", "ws", "http-proxy", "socks5", "oidc", "gzip"] }
k8s-openapi = { version = "0.29", features = ["latest"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "signal", "net", "io-util", "time", "process"] }
futures = "0.3"
base64 = "0.23"
flate2 = "1"
bytes = "1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
dirs = "7"
portable-pty = "0.9"
ring = "0.17"
serde-saphyr = "2"
secrecy = "0.10"
regex = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "system-proxy", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# TypeScript types for the UI, written to ui/src/lib/api/generated by `cargo test`.
ts-rs = { version = "12", features = ["no-serde-warnings", "serde-json-impl"] }
thiserror = "2"
http = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.7", features = ["fs", "trace"] }
clap = { version = "4", features = ["derive", "env"] }
