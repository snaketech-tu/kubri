[workspace]
resolver = "2"
members = ["crates/kubri-core", "crates/kubri-server", "ui/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/snaketech-tu/kubri"
rust-version = "1.90"

[workspace.dependencies]
kubri-core = { path = "crates/kubri-core" }
kube = { version = "4.2", default-features = false, features = ["client", "config", "runtime", "rustls-tls", "ring", "ws", "http-proxy", "socks5", "oidc", "gzip"] }
k8s-openapi = { version = "0.28", features = ["latest"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "signal", "net", "io-util", "time"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
http = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
clap = { version = "4", features = ["derive", "env"] }
