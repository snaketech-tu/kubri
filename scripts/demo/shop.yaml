# A small online shop for Kubri's demo snapshot: healthy workloads, structured logs, and a few
# typical problems (a crash loop, an image that does not exist, a pod that does not fit).
# scripts/demo/make.sh applies it and saves the snapshot.
apiVersion: v1
kind: Namespace
metadata:
  name: shop
  labels:
    team: storefront
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: shop-config
  namespace: shop
data:
  CURRENCY: EUR
  FEATURE_RECOMMENDATIONS: "true"
  REDIS_URL: redis://redis:6379
---
apiVersion: v1
kind: Secret
metadata:
  name: shop-db
  namespace: shop
type: Opaque
stringData:
  username: shop
  password: not-a-real-password
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
  namespace: shop
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: api-reader
  namespace: shop
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: api-reader
  namespace: shop
subjects:
  - kind: ServiceAccount
    name: api
    namespace: shop
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: api-reader
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: shop
  labels:
    app: frontend
    tier: web
  annotations:
    kubernetes.io/change-cause: "frontend 2.4.1: new checkout page"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        tier: web
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: frontend
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              mkdir -p /www && echo '<h1>Shop</h1>' > /www/index.html
              httpd -p 8080 -h /www
              paths="/ /products /products/42 /cart /checkout /static/app.js /static/app.css /search?q=shoes"
              while true; do
                for p in $paths; do
                  code=200; size=$((RANDOM % 4000 + 300))
                  [ $((RANDOM % 23)) -eq 0 ] && code=404
                  echo "10.42.0.$((RANDOM % 200 + 2)) - - [$(date -u '+%d/%b/%Y:%H:%M:%S +0000')] \"GET $p HTTP/1.1\" $code $size \"-\" \"Mozilla/5.0\""
                  sleep 0.$((RANDOM % 9 + 1))
                done
              done
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests:
              cpu: 20m
              memory: 16Mi
            limits:
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: shop
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: shop
  labels:
    app: api
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
        tier: backend
    spec:
      serviceAccountName: api
      terminationGracePeriodSeconds: 1
      containers:
        - name: api
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              mkdir -p /www && echo ok > /www/healthz
              httpd -p 8080 -h /www
              set -- "GET /api/products" "GET /api/products/42" "POST /api/cart" "GET /api/cart" "POST /api/checkout" "GET /api/recommendations"
              while true; do
                for r in "$@"; do
                  m=${r%% *}; p=${r#* }; status=200; level=info; ms=$((RANDOM % 80 + 3)); msg=request
                  if [ "$p" = "/api/checkout" ] && [ $((RANDOM % 6)) -eq 0 ]; then status=502; level=error; ms=$((RANDOM % 900 + 1000)); msg="payment service unavailable"; fi
                  if [ $((RANDOM % 15)) -eq 0 ]; then level=warn; ms=$((RANDOM % 400 + 600)); msg="slow request"; fi
                  echo "{\"time\":\"$(date -u '+%Y-%m-%dT%H:%M:%SZ')\",\"level\":\"$level\",\"msg\":\"$msg\",\"method\":\"$m\",\"path\":\"$p\",\"status\":$status,\"duration_ms\":$ms,\"trace_id\":\"$(head -c 8 /dev/urandom | od -An -tx1 | tr -d ' \n')\"}"
                  sleep 0.$((RANDOM % 9 + 1))
                done
              done
          envFrom:
            - configMapRef:
                name: shop-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shop-db
                  key: password
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: shop
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  namespace: shop
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
  namespace: shop
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: api
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-from-frontend
  namespace: shop
spec:
  podSelector:
    matchLabels:
      app: api
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: frontend
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shop
  namespace: shop
spec:
  rules:
    - host: shop.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  name: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: shop
  labels:
    app: redis
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: redis
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "1:C $(date -u '+%d %b %Y %H:%M:%S') # Redis version=7.2.4, bits=64, pid=1, just started"
              echo "1:M $(date -u '+%d %b %Y %H:%M:%S') * Server initialized"
              echo "1:M $(date -u '+%d %b %Y %H:%M:%S') * Ready to accept connections tcp"
              while true; do sleep 60; echo "1:M $(date -u '+%d %b %Y %H:%M:%S') * 100 changes in 60 seconds. Saving..."; done
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: shop
spec:
  clusterIP: None
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
---
# Crashes after a few seconds: the likely problem and the previous logs show why.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: emails
  namespace: shop
  labels:
    app: emails
spec:
  replicas: 1
  selector:
    matchLabels:
      app: emails
  template:
    metadata:
      labels:
        app: emails
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: emails
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "starting emails worker 1.8.0"
              echo "connecting to smtp://mail.shop.internal:587"
              sleep 3
              echo "ERROR dial tcp: lookup mail.shop.internal: no such host"
              echo "FATAL could not reach the mail server after 3 attempts"
              exit 1
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
---
# An image that does not exist.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
  namespace: shop
  labels:
    app: payments
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payments
  template:
    metadata:
      labels:
        app: payments
    spec:
      containers:
        - name: payments
          image: registry.example.invalid/shop/payments:2.1.0
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
---
# Asks for more memory than any node has.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reports
  namespace: shop
  labels:
    app: reports
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reports
  template:
    metadata:
      labels:
        app: reports
    spec:
      # No node has this label: the pod waits to be scheduled.
      nodeSelector:
        node.kubernetes.io/pool: reporting
      containers:
        - name: reports
          image: busybox:1.36
          command: ["sleep", "1000000"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cleanup
  namespace: shop
spec:
  schedule: "*/2 * * * *"
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: cleanup
              image: busybox:1.36
              command:
                - sh
                - -c
                - echo "removed $((RANDOM % 40)) expired carts"; echo "done in 0.$((RANDOM % 9))s"
